      <rect x="0" y="90" width="12" height="12" rx="3" class="cell0"/><rect x="18" y="90" width="12" height="12" rx="3" class="cell1"/><rect x="36" y="90" width="12" height="12" rx="3" class="cell2"/><rect x="54" y="90" width="12" height="12" rx="3" class="cell1"/><rect x="72" y="90" width="12" height="12" rx="3" class="cell0"/><rect x="90" y="90" width="12" height="12" rx="3" class="cell3"/><rect x="108" y="90" width="12" height="12" rx="3" class="cell0"/><rect x="126" y="90" width="12" height="12" rx="3" class="cell2"/><rect x="144" y="90" width="12" height="12" rx="3" class="cell0"/><rect x="162" y="90" width="12" height="12" rx="3" class="cell0"/><rect x="180" y="90" width="12" height="12" rx="3" class="cell0"/><rect x="198" y="90" width="12" height="12" rx="3" class="cell0"/>
      <!-- IELTS Listening -->
      <rect x="0" y="120" width="12" height="12" rx="3" class="cell0"/><rect x="18" y="120" width="12" height="12" rx="3" class="cell2"/><rect x="36" y="120" width="12" height="12" rx="3" class="cell4"/><rect x="54" y="120" width="12" height="12" rx="3" class="cell2"/><rect x="72" y="120" width="12" height="12" rx="3" class="cell2"/><rect x="90" y="120" width="12" height="12" rx="3" class="cell1"/><rect x="108" y="120" width="12" height="12" rx="3" class="cell0"/><rect x="126" y="120" width="12" height="12" rx="3" class="cell1"/><rect x="144" y="120" width="12" height="12" rx="3" class="cell0"/><rect x="162" y="120" width="12" height="12" rx="3" class="cell0"/><rect x="180" y="120" width="12" height="12" rx="3" class="cell0"/><rect x="198" y="120" width="12" height="12" rx="3" class="cell0"/>
      <!-- GPA -->
      <rect x="0" y="150" width="12" height="12" rx="3" class="cell1"/><rect x="18" y="150" width="12" height="12" rx="3" class="cell2"/><rect x="36" y="150" width="12" height="12" rx="3" class="cell1"/><rect x="54" y="150" width="12" height="12" rx="3" class="cell3"/><rect x="72" y="150" width="12" height="12" rx="3" class="cell1"/><rect x="90" y="150" width="12" height="12" rx="3" class="cell0"/><rect x="108" y="150" width="12" height="12" rx="3" class="cell2"/><rect x="126" y="150" width="12" height="12" rx="3" class="cell4"/><rect x="144" y="150" width="12" height="12" rx="3" class="cell1"/><rect x="162" y="150" width="12" height="12" rx="3" class="cell0"/><rect x="180" y="150" width="12" height="12" rx="3" class="cell0"/><rect x="198" y="150" width="12" height="12" rx="3" class="cell0"/>
    </g>
  </g>

  <rect x="36" y="500" width="270" height="82" rx="12" class="panel"/>
  <text x="54" y="528" class="h2">Today</text>
  <text x="54" y="552" class="subtitle">Capture messy Inbox in Obsidian.</text>
  <text x="54" y="570" class="subtitle">Nightly Codex turns it into structure.</text>

  <rect x="326" y="500" width="270" height="82" rx="12" class="panel"/>
  <text x="344" y="528" class="h2">Project Graph</text>
  <text x="344" y="552" class="subtitle">Each event has project, score, type, next.</text>
  <text x="344" y="570" class="subtitle">Think Git commits, but for life/projects.</text>

  <rect x="616" y="500" width="268" height="82" rx="12" class="panel"/>
  <text x="634" y="528" class="h2">Output</text>
  <text x="634" y="552" class="subtitle">Daily review → tomorrow todo → content ideas.</text>
  <text x="634" y="570" class="subtitle">GitHub is the public/visual layer.</text>
</svg>
