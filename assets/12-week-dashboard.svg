      <rect x="0" y="60" width="12" height="12" rx="3" class="cell0"/><rect x="18" y="60" width="12" height="12" rx="3" class="cell0"/><rect x="36" y="60" width="12" height="12" rx="3" class="cell0"/><rect x="54" y="60" width="12" height="12" rx="3" class="cell0"/><rect x="72" y="60" width="12" height="12" rx="3" class="cell0"/><rect x="90" y="60" width="12" height="12" rx="3" class="cell0"/><rect x="108" y="60" width="12" height="12" rx="3" class="cell0"/><rect x="126" y="60" width="12" height="12" rx="3" class="cell1"/><rect x="144" y="60" width="12" height="12" rx="3" class="cell0"/><rect x="162" y="60" width="12" height="12" rx="3" class="cell0"/><rect x="180" y="60" width="12" height="12" rx="3" class="cell0"/><rect x="198" y="60" width="12" height="12" rx="3" class="cell0"/>
