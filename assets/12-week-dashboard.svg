<svg width="920" height="620" viewBox="0 0 920 620" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #0d1117; }
    .panel { fill: #161b22; stroke: #30363d; stroke-width: 1; }
    .title { fill: #f0f6fc; font: 700 28px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif; }
    .subtitle { fill: #8b949e; font: 500 13px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif; }
    .h2 { fill: #f0f6fc; font: 700 16px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif; }
    .label { fill: #c9d1d9; font: 600 12px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif; }
    .muted { fill: #8b949e; font: 500 11px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif; }
    .num { fill: #f0f6fc; font: 700 22px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif; }
    .cell0 { fill: #21262d; }
    .cell1 { fill: #0e4429; }
    .cell2 { fill: #006d32; }
    .cell3 { fill: #26a641; }
    .cell4 { fill: #39d353; }
    .accent { fill: #58a6ff; }
    .green { fill: #3fb950; }
    .yellow { fill: #d29922; }
    .purple { fill: #a371f7; }
  </style>

  <rect class="bg" width="920" height="620" rx="18"/>

  <text x="36" y="52" class="title">12-Week Plan Dashboard</text>
  <text x="36" y="78" class="subtitle">Personal project system: daily notes as commits, projects as repos, reviews as release notes.</text>

  <rect x="36" y="105" width="190" height="92" rx="12" class="panel"/>
  <text x="54" y="132" class="muted">CURRENT PHASE</text>
  <text x="54" y="162" class="num">W11 / W12</text>
  <text x="54" y="183" class="subtitle">Final stretch</text>

  <rect x="246" y="105" width="190" height="92" rx="12" class="panel"/>
  <text x="264" y="132" class="muted">TARGET</text>
  <text x="264" y="162" class="num">85%</text>
  <text x="264" y="183" class="subtitle">12-week average</text>

  <rect x="456" y="105" width="190" height="92" rx="12" class="panel"/>
  <text x="474" y="132" class="muted">RECORDED AVG</text>
  <text x="474" y="162" class="num">57%</text>
  <text x="474" y="183" class="subtitle">From weekly scorecard</text>

  <rect x="666" y="105" width="218" height="92" rx="12" class="panel"/>
  <text x="684" y="132" class="muted">MAIN LOOP</text>
  <text x="684" y="162" class="num">Inbox → Review</text>
  <text x="684" y="183" class="subtitle">Nightly structure by Codex</text>

  <rect x="36" y="226" width="848" height="246" rx="14" class="panel"/>
  <text x="56" y="258" class="h2">Project Heatmap</text>
  <text x="56" y="279" class="subtitle">Each square is a commit-like progress event from Obsidian or weekly tasks.</text>

  <g transform="translate(56 306)">
    <text x="0" y="12" class="label">Advanced Math</text>
    <text x="0" y="42" class="label">Matrix</text>
    <text x="0" y="72" class="label">Statistics</text>
    <text x="0" y="102" class="label">IELTS Writing</text>
    <text x="0" y="132" class="label">IELTS Listening</text>
    <text x="0" y="162" class="label">GPA / Coursework</text>

    <g transform="translate(150 0)">
