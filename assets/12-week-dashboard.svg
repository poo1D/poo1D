      <rect x="0" y="0" width="12" height="12" rx="3" class="cell0"/><rect x="18" y="0" width="12" height="12" rx="3" class="cell0"/><rect x="36" y="0" width="12" height="12" rx="3" class="cell1"/><rect x="54" y="0" width="12" height="12" rx="3" class="cell0"/><rect x="72" y="0" width="12" height="12" rx="3" class="cell2"/><rect x="90" y="0" width="12" height="12" rx="3" class="cell1"/><rect x="108" y="0" width="12" height="12" rx="3" class="cell0"/><rect x="126" y="0" width="12" height="12" rx="3" class="cell3"/><rect x="144" y="0" width="12" height="12" rx="3" class="cell0"/><rect x="162" y="0" width="12" height="12" rx="3" class="cell4"/><rect x="180" y="0" width="12" height="12" rx="3" class="cell0"/><rect x="198" y="0" width="12" height="12" rx="3" class="cell0"/>
